<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fafbf9"><title>躁鬱睡眠グラフ</title><link rel="icon" href="icons/icon.svg"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><script src="model.js" defer></script><script src="app.js" defer></script><script src="pwa.js" defer></script></head>
<body>
<header><h1>躁鬱睡眠グラフ</h1><div class="actions"><button id="export" aria-label="JSONエクスポート" title="JSONエクスポート"><svg viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/></svg></button><button id="import" aria-label="JSONインポート" title="JSONインポート"><svg viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 16v5h16v-5"/></svg></button><button id="add" class="primary" aria-label="記録を追加" title="記録を追加"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><input id="file" type="file" accept=".json,application/json" hidden></div></header>
<main><p id="notice" role="status" hidden></p><section id="graph-view" aria-label="24時間グラフ"><div class="panel"><div class="toolbar"><h3 id="month-title"></h3><div><button id="prev" aria-label="前の月">‹</button><button id="today">今月</button><button id="next" aria-label="次の月">›</button></div></div><div class="chart"><div class="chart-heading"><div id="legend" class="legend"></div><div class="axis"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div></div><div id="rows"></div></div></div></section>
<section id="timeline-view" aria-label="タイムライン" hidden><div id="timeline" class="panel"></div></section></main>
<nav aria-label="メインナビゲーション"><button id="graph-tab" aria-current="page"><svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V4M19 20V8"/></svg>グラフ</button><button id="timeline-tab"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>タイムライン</button></nav>
<dialog id="editor"><form id="form"><div class="dialog-heading"><h2 id="edit-title">記録を追加</h2><button type="button" id="close" aria-label="閉じる">×</button></div><fieldset class="type-options"><legend class="sr-only">記録の種類</legend><label><input type="radio" name="type" value="bed" checked><span>🌙 就寝</span></label><label><input type="radio" name="type" value="wake"><span>☀️ 起床</span></label></fieldset><label class="field">日時<input id="at" type="datetime-local" required min="1900-01-01T00:00" max="9999-12-31T23:59"></label><fieldset id="mood-field"><legend>就寝時の気分</legend><div id="moods" class="mood-options"></div></fieldset><label class="field">メモ <span class="optional">（任意）</span><textarea id="note" rows="4" maxlength="1000" placeholder="体調や、その日にあったことなど"></textarea></label><p id="form-error" role="alert"></p><div class="form-actions"><button id="delete" type="button" class="danger" hidden>記録を削除</button><button type="submit" class="primary">保存する</button></div></form></dialog>
</body></html>
